# Airwindows Mastering MPC skin layout, two tabs: MASTER and PRESET (the knob only browses the 32 slots, LOAD and SAVE act).
# Grid and r=48 are those of mpc-vst-rattler. Black panel, white print, amber accent.
style=td3
theme_bg=111111
theme_panel=111111
theme_line=000000
theme_ink=f2f2f2
theme_ink_dim=a0a0a0
theme_ink_faint=555555
theme_accent=e0a526
theme_accent_hi=ffcf66
theme_knob_face=262626
theme_knob_ring=000000
theme_bar=e0a526
theme_seg_active=e0a526
theme_seg_inactive=262626
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=000000
theme_knob_off=444444
theme_tab_on=e0a526
theme_tab_on_tx=111111
theme_lcd=141004
theme_box=0a0a0a
theme_btn_bg=f2f2f2
theme_chrome_ink=f2f2f2
theme_go_on=e0a526
theme_go_off=ffcf66
theme_tabs=e0a526

[tab MASTER]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="GLUE" key=glue
knob cx=490 cy=250 r=48 label="SCOPE" key=scope
knob cx=790 cy=250 r=48 label="SKRONK" key=skronk
knob cx=1090 cy=250 r=48 label="GIRTH" key=girth
knob cx=190 cy=530 r=48 label="DRIVE" key=drive
popup cx=490 cy=530 w=220 h=48 label="DITHER" key=dither
qlinks "MASTER" = glue,scope,skronk,girth,drive,dither

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
button cx=340 cy=390 label="LOAD" key=load
knob cx=640 cy=380 r=48 label="PRESET" key=slot
button cx=940 cy=390 label="SAVE" key=save
qlinks "PRESET" = slot,load,save
